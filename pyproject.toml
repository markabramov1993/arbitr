[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bounty-radar"
version = "0.1.0"
description = "Evidence-aware discovery of high-value blockchain bounties"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["bounty_radar*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
