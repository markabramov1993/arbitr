name: RustChain Agent Jobs Live Probe

on:
  push:
    paths:
      - '.github/workflows/rustchain-agent-jobs-live.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch public Agent Economy jobs
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 20 \
            https://rustchain.org/agent/jobs \
            -o /tmp/agent_jobs.json
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path('/tmp/agent_jobs.json').read_text())
          jobs = data.get('jobs', data if isinstance(data, list) else [])
          if not isinstance(jobs, list):
              print(json.dumps(data, indent=2)[:12000])
              raise SystemExit(0)

          open_jobs = [j for j in jobs if str(j.get('status', '')).lower() == 'open']
          open_jobs.sort(key=lambda j: float(j.get('reward_rtc') or 0), reverse=True)
          print(f'OPEN_JOB_COUNT={len(open_jobs)}')
          for j in open_jobs[:50]:
              keep = {k: j.get(k) for k in (
                  'id','job_id','title','description','category','reward_rtc',
                  'status','tags','expires_at','poster_wallet','created_at'
              ) if k in j}
              print('JOB=' + json.dumps(keep, ensure_ascii=False, sort_keys=True))
          PY
