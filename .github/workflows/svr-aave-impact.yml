name: SVR AAVE Debt Impact Backtest

on:
  push:
    paths:
      - '.github/workflows/svr-aave-impact.yml'
  workflow_dispatch:

jobs:
  impact:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Discover AAVE debtors and test hinted price shock at auction-receive block
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, subprocess, urllib.request, time, math
          RPC='https://base-mainnet.g.alchemy.com/public'
          POOL='0xA238Dd80C259a72e81d7e4664a9801593F98d1c5'
          AAVE='0x63706e401c06ac8513145b7687A14804d17f814b'.lower()
          AAVE_ATOKEN='0x67EAF2BeE4384a2f84Da9Eb8105C661C123736BA'.lower()
          AAVE_VTOKEN='0xcEC1Ea95dDEF7CFC27D3D9615E05b035af460978'.lower()
          AAVE_ORACLE='0x2Cc0Fc26eD4563A5ce5e8bdcfe1A2878676Ae156'
          BLOCK=50860460
          OLD_PRICE=13405719000      # 8 decimals, captured at auction receive
          HINT_PRICE=13474405827     # 8 decimals, from SVR hints
          DELTA=HINT_PRICE/OLD_PRICE-1
          FROM=max(0,BLOCK-2_500_000)
          CHUNK=5000
          def rpc(method,params):
              body=json.dumps({'jsonrpc':'2.0','id':1,'method':method,'params':params}).encode()
              req=urllib.request.Request(RPC,data=body,headers={'Content-Type':'application/json','User-Agent':'profit-engine-aave-impact/0.1'})
              with urllib.request.urlopen(req,timeout=25) as r:
                  d=json.load(r)
              if d.get('error'): raise RuntimeError(d['error'])
              return d['result']
          topic0=subprocess.check_output(['cast','keccak','Borrow(address,address,address,uint256,uint8,uint256,uint16)'],text=True).strip()
          reserve_topic='0x'+'0'*24+AAVE[2:]
          users=set(); calls=0
          # Scan recent AAVE borrows; current balance later removes fully repaid accounts.
          for lo in range(FROM,BLOCK+1,CHUNK):
              hi=min(BLOCK,lo+CHUNK-1)
              try:
                  logs=rpc('eth_getLogs',[{'address':POOL,'fromBlock':hex(lo),'toBlock':hex(hi),'topics':[topic0,reserve_topic]}])
              except Exception as e:
                  print('LOG_CHUNK_ERROR',lo,hi,str(e)[:180]); continue
              calls+=1
              for lg in logs:
                  ts=lg.get('topics') or []
                  if len(ts)>=3:
                      users.add('0x'+ts[2][-40:])
          def cast_call(addr,sig,args=()):
              cmd=['cast','call',addr,sig,*map(str,args),'--block',str(BLOCK),'--rpc-url',RPC]
              return subprocess.check_output(cmd,text=True,stderr=subprocess.DEVNULL).strip()
          def firstint(txt):
              line=txt.splitlines()[0].split()[0]
              return int(line,0)
          candidates=[]; active=0
          for u in users:
              try:
                  debt=firstint(cast_call(AAVE_VTOKEN,'balanceOf(address)(uint256)',[u]))
                  if debt==0: continue
                  active+=1
                  acol=firstint(cast_call(AAVE_ATOKEN,'balanceOf(address)(uint256)',[u]))
                  vals=cast_call(POOL,'getUserAccountData(address)(uint256,uint256,uint256,uint256,uint256,uint256)',[u]).splitlines()
                  nums=[int(x.split()[0],0) for x in vals[:6]]
                  total_coll,total_debt,avail,liq_thr,ltv,hf=nums
                  if total_debt==0 or hf==0: continue
                  # Aave base currency values use 1e8. AAVE has 18 decimals.
                  aave_debt_base=debt*OLD_PRICE//10**18
                  frac=aave_debt_base/total_debt
                  old_hf=hf/1e18
                  if acol==0:
                      new_debt=total_debt + aave_debt_base*DELTA
                      new_hf=old_hf*(total_debt/new_debt)
                  else:
                      new_hf=None
                  rec={'user':u,'aaveDebt':debt/1e18,'aaveDebtUSD':aave_debt_base/1e8,'debtFraction':frac,'aaveCollateral':acol/1e18,'oldHF':old_hf,'projectedHF':new_hf}
                  if old_hf < 1.08 or (new_hf is not None and new_hf < 1.01): candidates.append(rec)
              except Exception as e:
                  continue
          candidates.sort(key=lambda x:(999 if x['projectedHF'] is None else x['projectedHF']))
          crossed=[x for x in candidates if x['projectedHF'] is not None and x['oldHF']>=1 and x['projectedHF']<1]
          already=[x for x in candidates if x['oldHF']<1]
          print('SUMMARY',json.dumps({'block':BLOCK,'fromBlock':FROM,'borrowLogChunks':calls,'uniqueBorrowers':len(users),'activeAaveDebtors':active,'deltaPct':DELTA*100,'nearCandidates':len(candidates),'crossedByHint':len(crossed),'alreadyBelow1':len(already)},separators=(',',':')))
          for x in crossed[:50]: print('CROSSED '+json.dumps(x,separators=(',',':')))
          for x in candidates[:30]: print('NEAR '+json.dumps(x,separators=(',',':')))
          PY
