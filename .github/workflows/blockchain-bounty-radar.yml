name: Blockchain Bounty Radar

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/blockchain-bounty-radar.yml'
  schedule:
    - cron: '7,22,37,52 * * * *'

permissions:
  contents: read
  issues: write

concurrency:
  group: blockchain-bounty-radar
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Scan public blockchain bounty sources
        id: scan
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee bounty-radar.md
          import json, os, re, urllib.parse, urllib.request, datetime

          now = datetime.datetime.now(datetime.timezone.utc).isoformat()
          print(f'# Blockchain bounty radar\n\nUTC: {now}\n')
          hits = []

          # Superteam public opportunity pages. We intentionally treat page text as discovery only.
          urls = [
              'https://superteam.fun/earn/bounties',
              'https://superteam.fun/earn/opportunities/development-bounties',
              'https://superteam.fun/earn/skill/blockchain',
          ]
          for url in urls:
              try:
                  req=urllib.request.Request(url,headers={'user-agent':'profit-engine-bounty-radar/1.0'})
                  text=urllib.request.urlopen(req,timeout=20).read().decode('utf-8','ignore')
                  # capture compact text around USDC/USDG amounts
                  plain=re.sub(r'<[^>]+>',' ',text)
                  plain=re.sub(r'\s+',' ',plain)
                  for m in re.finditer(r'(?i)(?:USDC|USDG|\$)\s*([0-9][0-9,]*(?:\.\d+)?)|([0-9][0-9,]*(?:\.\d+)?)\s*(USDC|USDG)',plain):
                      s=max(0,m.start()-120); e=min(len(plain),m.end()+220)
                      snippet=plain[s:e]
                      nums=re.findall(r'[0-9][0-9,]*(?:\.\d+)?',m.group(0))
                      amount=float(nums[0].replace(',','')) if nums else 0
                      if amount>=500:
                          hits.append(('Superteam',amount,url,snippet[:420]))
              except Exception as e:
                  print(f'- Superteam fetch failed: {url}: {e}')

          # GitHub public issues mentioning explicit USD/USDC bounties.
          q='is:issue is:open (bounty OR reward) (USDC OR USDG OR "$500" OR "$1000" OR "$5000")'
          api='https://api.github.com/search/issues?q='+urllib.parse.quote(q)+'&sort=updated&order=desc&per_page=50'
          try:
              req=urllib.request.Request(api,headers={'Accept':'application/vnd.github+json','Authorization':'Bearer '+os.environ['GH_TOKEN'],'User-Agent':'profit-engine-bounty-radar'})
              data=json.loads(urllib.request.urlopen(req,timeout=20).read())
              for it in data.get('items',[]):
                  blob=(it.get('title','')+' '+(it.get('body') or ''))
                  amts=[]
                  for pat in [r'\$\s*([0-9][0-9,]*)',r'([0-9][0-9,]*)\s*(?:USDC|USDG)']:
                      for x in re.findall(pat,blob,re.I):
                          try: amts.append(float((x if isinstance(x,str) else x[0]).replace(',','')))
                          except: pass
                  amount=max(amts or [0])
                  if amount>=500:
                      hits.append(('GitHub',amount,it.get('html_url'),it.get('title','')))
          except Exception as e:
              print(f'- GitHub search failed: {e}')

          # Deduplicate by URL + compact summary.
          seen=set(); uniq=[]
          for src,amt,url,title in sorted(hits,key=lambda x:x[1],reverse=True):
              k=(url,title[:100])
              if k in seen: continue
              seen.add(k); uniq.append((src,amt,url,title))

          print('## High-value discovery hits (>=500 nominal)')
          if not uniq:
              print('\nNo high-value public hits in this pass.')
          for src,amt,url,title in uniq[:30]:
              safe=title.replace('\n',' ')[:260]
              print(f'- {src} | nominal {amt:g} | {url} | {safe}')

          max_amt=max([x[1] for x in uniq] or [0])
          print(f'\nMAX_NOMINAL_DISCOVERY={max_amt:g}')
          print('\nDiscovery is not payout proof. Eligibility, funding, deadlines and acceptance must be verified before work.')

          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write(f'high={"true" if max_amt>=1000 else "false"}\n')
              f.write(f'max_amount={max_amt:g}\n')
          PY

      - name: Create/update high-value radar alert
        if: steps.scan.outputs.high == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          MAX_AMOUNT: ${{ steps.scan.outputs.max_amount }}
        run: |
          set -euo pipefail
          TITLE='[RADAR] High-value blockchain bounty discovery'
          BODY=$(cat bounty-radar.md)
          NUM=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$TITLE in:title" --json number --jq '.[0].number // empty')
          if [ -n "$NUM" ]; then
            gh issue edit "$NUM" --repo "$GITHUB_REPOSITORY" --body "$BODY"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "$BODY"
          fi

      - name: Upload radar snapshot
        uses: actions/upload-artifact@v4
        with:
          name: blockchain-bounty-radar
          path: bounty-radar.md
          retention-days: 7
