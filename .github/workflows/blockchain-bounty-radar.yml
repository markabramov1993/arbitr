name: Blockchain Bounty Radar

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/blockchain-bounty-radar.yml'
      - 'scripts/blockchain_bounty_radar.py'
      - 'scripts/test_blockchain_bounty_radar.py'
  schedule:
    - cron: '7,22,37,52 * * * *'

permissions:
  contents: read
  issues: write

concurrency:
  group: blockchain-bounty-radar
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Unit tests for trap / eligibility filters
        working-directory: scripts
        run: python3 -m unittest -v test_blockchain_bounty_radar.py

      - name: Scan public blockchain bounty sources
        id: scan
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/blockchain_bounty_radar.py | tee bounty-radar.md

      - name: Create/update high-value radar alert
        if: steps.scan.outputs.high == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          MAX_AMOUNT: ${{ steps.scan.outputs.max_amount }}
        run: |
          set -euo pipefail
          TITLE='[RADAR] High-value blockchain bounty discovery'
          BODY=$(cat bounty-radar.md)
          NUM=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$TITLE in:title" --json number --jq '.[0].number // empty')
          if [ -n "$NUM" ]; then
            gh issue edit "$NUM" --repo "$GITHUB_REPOSITORY" --body "$BODY"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "$BODY"
          fi

      - name: Upload radar snapshot
        uses: actions/upload-artifact@v4
        with:
          name: blockchain-bounty-radar
          path: bounty-radar.md
          retention-days: 7
