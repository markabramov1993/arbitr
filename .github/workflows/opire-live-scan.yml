name: Opire Live Reward Scan

on:
  push:
    paths:
      - '.github/workflows/opire-live-scan.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read public Opire rewards API
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import urllib.request

          url = 'https://api.opire.dev/rewards'
          req = urllib.request.Request(url, headers={'User-Agent': 'FLASH-opire-live-scan/1.1'})
          with urllib.request.urlopen(req, timeout=30) as r:
              raw = r.read()
              print(f'HTTP={r.status}')
              print(f'BYTES={len(raw)}')
              data = json.loads(raw)

          rows = data if isinstance(data, list) else data.get('rewards', data.get('items', data.get('data', [])))
          if not isinstance(rows, list):
              print('TOP_LEVEL_TYPE=' + type(data).__name__)
              if isinstance(data, dict):
                  print('TOP_LEVEL_KEYS=' + ','.join(sorted(data.keys())))
              raise SystemExit(0)

          print(f'TOTAL_ROWS={len(rows)}')
          if rows:
              print('ROW_KEYS=' + ','.join(sorted(rows[0].keys())))
              # Print a shallow sample with nested values summarized so the scanner can adapt
              sample = {}
              for k, v in rows[0].items():
                  if isinstance(v, dict):
                      sample[k] = {'_type':'dict','keys':sorted(v.keys())}
                  elif isinstance(v, list):
                      sample[k] = {'_type':'list','len':len(v),'first':v[0] if v and isinstance(v[0], (str,int,float,bool,type(None))) else None}
                  else:
                      sample[k] = v
              print('ROW_SAMPLE=' + json.dumps(sample, ensure_ascii=False, sort_keys=True)[:12000])

          # Also show the nested shapes for monetary/participation-looking fields only.
          for i, row in enumerate(rows[:5]):
              out = {'id': row.get('id'), 'title': row.get('title'), 'url': row.get('url')}
              for k, v in row.items():
                  lk = k.lower()
                  if any(x in lk for x in ('amount','price','reward','claim','try','solver','user','currency','payment','issue','project')):
                      out[k] = v
              print(f'ROW_{i}=' + json.dumps(out, ensure_ascii=False, sort_keys=True)[:12000])
          PY
