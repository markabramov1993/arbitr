name: BoTTube Trending Timeframe Probe

on:
  push:
    paths:
      - '.github/workflows/bottube-trending-timeframe-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Compare public trending timeframe queries
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import urllib.parse
          import urllib.request

          base = 'https://bottube.ai/api/trending'
          values = ['hour', 'day', 'week', 'month', 'definitely-invalid']
          rows = []
          for value in values:
              url = base + '?' + urllib.parse.urlencode({'limit': 5, 'timeframe': value})
              req = urllib.request.Request(url, headers={'User-Agent': 'FLASH-read-only-contract-probe/1.0'})
              try:
                  with urllib.request.urlopen(req, timeout=20) as r:
                      body = r.read()
                      status = r.status
              except urllib.error.HTTPError as e:
                  body = e.read()
                  status = e.code
              digest = hashlib.sha256(body).hexdigest()
              try:
                  data = json.loads(body)
                  ids = [v.get('id') or v.get('video_id') for v in data.get('videos', [])]
              except Exception:
                  ids = []
              row = {'timeframe': value, 'status': status, 'sha256': digest, 'ids': ids}
              rows.append(row)
              print(json.dumps(row, sort_keys=True))

          valid_hashes = {r['sha256'] for r in rows if r['timeframe'] != 'definitely-invalid'}
          print('VALID_HASH_COUNT=' + str(len(valid_hashes)))
          print('INVALID_STATUS=' + str(rows[-1]['status']))
          print('RESULT=' + json.dumps(rows, sort_keys=True))
          PY
