name: Base Aerodrome Slipstream Cycle Scan

on:
  workflow_dispatch:
  push:
    branches: [profit-engine-v07]
    paths:
      - '.github/workflows/base-aerodrome-slipstream-scan.yml'

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Discover Slipstream pools and quote cycles
        shell: bash
        run: |
          set -euo pipefail
          export RPC_PRIMARY=https://base-mainnet.g.alchemy.com/public
          export RPC_FALLBACK=https://mainnet.base.org
          export FACTORY=0x5e7BB104d84c7CB9B682AaC2F3d509f5F406809A
          export QUOTER=0x254cF9E1E6e233aa1AC962CB9B05b2cfeAaE15b0
          export AAVE=0xA238Dd80C259a72e81d7e4664a9801593F98d1c5
          export WETH=4200000000000000000000000000000000000006
          export USDC=833589fcd6edb6e08f4c7c32d4f71b54bda02913
          export SEL_SPACINGS=$(cast sig 'tickSpacings()')
          export SEL_GETPOOL=$(cast sig 'getPool(address,address,int24)')
          export SEL_SWAPFEE=$(cast sig 'getSwapFee(address)')
          export SEL_QUOTE=$(cast sig 'quoteExactInput(bytes,uint256)')
          export SEL_FLASH=$(cast sig 'FLASHLOAN_PREMIUM_TOTAL()')

          python3 - <<'PY'
          import os,json,urllib.request
          urls=[os.environ['RPC_PRIMARY'],os.environ['RPC_FALLBACK']]
          factory=os.environ['FACTORY']; quoter=os.environ['QUOTER']; aave=os.environ['AAVE']
          usdc=os.environ['USDC']; weth=os.environ['WETH']
          def ui(x): return x.to_bytes(32,'big').hex()
          def ai(a): return ('0'*24)+a.lower().replace('0x','')
          def int24word(x): return (x & ((1<<256)-1)).to_bytes(32,'big').hex()
          def enc_bytes(raw):
              b=bytes.fromhex(raw); pad=(32-len(b)%32)%32
              return ui(len(b))+b.hex()+'00'*pad
          def calldata(sel, words=''): return sel+words
          def post(url,payload):
              req=urllib.request.Request(url,data=json.dumps(payload).encode(),headers={'content-type':'application/json','user-agent':'profit-engine-v07'})
              with urllib.request.urlopen(req,timeout=30) as r:return json.loads(r.read())
          def rpc(reqs):
              last=None
              for url in urls:
                  try:
                      out=[]
                      for i in range(0,len(reqs),40):
                          x=post(url,reqs[i:i+40]);
                          if not isinstance(x,list): raise RuntimeError(x)
                          out+=x
                      print('RPC='+url); return {x['id']:x for x in out}
                  except Exception as e:last=e;print('RPC failed',url,e)
              raise RuntimeError(last)
          def dyn_ints(raw):
              h=raw[2:]; off=int(h[:64],16)*2; n=int(h[off:off+64],16); vals=[]
              p=off+64
              for i in range(n):
                  v=int(h[p+i*64:p+(i+1)*64],16)
                  if v&(1<<255): v-=1<<256
                  vals.append(v)
              return vals
          init=[
            {'jsonrpc':'2.0','id':'block','method':'eth_blockNumber','params':[]},
            {'jsonrpc':'2.0','id':'gas','method':'eth_gasPrice','params':[]},
            {'jsonrpc':'2.0','id':'sp','method':'eth_call','params':[{'to':factory,'data':os.environ['SEL_SPACINGS']},'latest']},
            {'jsonrpc':'2.0','id':'flash','method':'eth_call','params':[{'to':aave,'data':os.environ['SEL_FLASH']},'latest']},
          ]
          b=rpc(init); block=int(b['block']['result'],16); gas=int(b['gas']['result'],16); flash_bps=int(b['flash']['result'],16)
          spacings=dyn_ints(b['sp']['result'])
          print('BLOCK',block,'GAS',gas,'FLASH_BPS',flash_bps,'TICK_SPACINGS',spacings)
          req=[]
          for s in spacings:
              data=os.environ['SEL_GETPOOL']+ai('0x'+usdc)+ai('0x'+weth)+int24word(s)
              req.append({'jsonrpc':'2.0','id':f'p:{s}','method':'eth_call','params':[{'to':factory,'data':data},'latest']})
          pools=rpc(req); active=[]
          for s in spacings:
              x=pools.get(f'p:{s}',{}).get('result','0x'); addr='0x'+x[-40:] if len(x)>=40 else '0x0'
              if int(addr,16)!=0: active.append((s,addr))
          print('ACTIVE_POOLS',active)
          req=[]
          for s,p in active:
              req.append({'jsonrpc':'2.0','id':f'f:{s}','method':'eth_call','params':[{'to':factory,'data':os.environ['SEL_SWAPFEE']+ai(p)},'latest']})
          fees=rpc(req) if req else {}
          for s,p in active:
              fee=int(fees[f'f:{s}']['result'],16)
              print(f'pool spacing={s} address={p} swapFeePips={fee} ({fee/10000:.4f}%)')
          def path(s1,s2):
              return usdc+(s1 & 0xffffff).to_bytes(3,'big').hex()+weth+(s2 & 0xffffff).to_bytes(3,'big').hex()+usdc
          qsel=os.environ['SEL_QUOTE'][2:]
          def qdata(s1,s2,amount): return '0x'+qsel+ui(64)+ui(amount)+enc_bytes(path(s1,s2))
          amounts=[5,10,25,50,100,250,500,1000,2500,5000,10000,25000,50000]
          req=[]; meta={}
          for s1,_ in active:
              for s2,_ in active:
                  if s1==s2:continue
                  for usd in amounts:
                      rid=f'q:{s1}:{s2}:{usd}';meta[rid]=(s1,s2,usd)
                      req.append({'jsonrpc':'2.0','id':rid,'method':'eth_call','params':[{'to':quoter,'data':qdata(s1,s2,int(usd*1e6))},'latest']})
          qr=rpc(req) if req else {}; best=None; ok=0;bad=0
          for rid,(s1,s2,usd) in meta.items():
              x=qr.get(rid)
              if not x or 'error'in x:bad+=1;continue
              h=x.get('result','0x')[2:]
              if len(h)<256:bad+=1;continue
              out=int(h[:64],16)/1e6; gas_est=int(h[192:256],16); gross=out-usd
              gas_usd=(gas_est+120000)*gas/1e18*2600+0.08; flash=usd*flash_bps/10000; net=gross-gas_usd-flash
              row={'route':f'USDC-slip({s1})->WETH-slip({s2})->USDC','input_usdc':usd,'output_usdc':out,'gross_usd':gross,'quoter_gas_estimate':gas_est,'flash_fee_usd':flash,'gas_plus_l1_reserve_usd':gas_usd,'estimated_net_usd':net,'block':block}
              ok+=1
              if best is None or net>best['estimated_net_usd']:best=row
          print('QUOTES_OK',ok,'BAD',bad);print('=== BEST SLIPSTREAM CYCLE ===')
          if best:
              best['note']='same-block QuoterV2 screen; not realized P&L; fork validation required'
              print(json.dumps(best,indent=2));print('CANDIDATE_NET_POSITIVE='+('yes' if best['estimated_net_usd']>0 else 'no'))
          else:print('No distinct active Slipstream pool cycle available.')
          PY
