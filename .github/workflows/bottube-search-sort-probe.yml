name: BoTTube Search Sort Probe

on:
  push:
    paths:
      - '.github/workflows/bottube-search-sort-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Compare public search sort values
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, urllib.parse, urllib.request, urllib.error
          base='https://bottube.ai/api/search'
          sorts=['relevance','recent','newest','views','definitely-invalid']
          for sort in sorts:
              url=base+'?'+urllib.parse.urlencode({'q':'rustchain','sort':sort})
              req=urllib.request.Request(url,headers={'User-Agent':'FLASH-read-only-contract-probe/1.0'})
              try:
                  with urllib.request.urlopen(req,timeout=20) as r:
                      body=r.read(); status=r.status
              except urllib.error.HTTPError as e:
                  body=e.read(); status=e.code
              try:
                  data=json.loads(body)
              except Exception:
                  data={'raw':body[:300].decode('utf-8','replace')}
              videos=data.get('videos',[]) if isinstance(data,dict) else []
              ids=[v.get('video_id') or v.get('id') for v in videos[:10] if isinstance(v,dict)]
              print(json.dumps({'sort':sort,'status':status,'sha256':hashlib.sha256(body).hexdigest(),'ids':ids,'keys':sorted(data.keys()) if isinstance(data,dict) else []},sort_keys=True))
          PY
