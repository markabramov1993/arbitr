name: LIVE Morpho wstETH Liquidation Watch

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/morpho-wsteth-live-watch.yml'

permissions:
  contents: read
  issues: write

concurrency:
  group: live-morpho-wsteth-watch
  cancel-in-progress: true

jobs:
  current-state-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: profit-engine-v07
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Test current Base state only — no time travel
        id: scan
        shell: bash
        run: |
          set -euo pipefail
          forge build >/dev/null
          REMOTE='https://base-mainnet.g.alchemy.com/public'; LOCAL='http://127.0.0.1:8545'
          MORPHO='0xBBBBBbbBBb9cC5e90e3b3Af64bdAF62C37EEFFCb'
          UNI_ROUTER='0x2626664c2603336E57B271c5C0b26F421741e481'; AERO_ROUTER='0xBE6D8f0d05cC4be24d5167a3eF062215bE6D18a5'
          WETH='0x4200000000000000000000000000000000000006'; WSTETH='0xc1CBa3fCea344f92D9239c08C0568f6F2F0ee452'
          ORACLE='0xaE10cbdAa587646246c8253E4532A002EE4fa7A4'; IRM='0x46415998764C29aB2a25CbeA6254146D50D22687'; LLTV='965000000000000000'
          MARKET='0x6aa81f51dfc955df598e18006deae56ce907ac02b0b5358705f1a28fcea23cc0'; BORROWER='0x10c53e75fE7A7E6bF58a9e68B6a30Fcc7D4e6e2c'
          EOA='0xf39Fd6e51aad88F6F4ce6aB8827279cffFb92266'
          MIN_CONTRACT_PROFIT='30000000000000000'
          MIN_NET_AFTER_RESERVE='20000000000000000'
          SAFETY_RESERVE_WEI='1000000000000000'

          anvil --fork-url "$REMOTE" --chain-id 8453 --port 8545 --silent >/tmp/anvil.log 2>&1 & PID=$!; trap 'kill $PID 2>/dev/null || true' EXIT
          for i in {1..25}; do cast block-number --rpc-url "$LOCAL" >/dev/null 2>&1 && break; sleep 1; done
          BLOCK=$(cast block-number --rpc-url "$LOCAL"); echo "CURRENT_FORK_BLOCK=$BLOCK"

          DEPLOY=$(forge create --rpc-url "$LOCAL" --from "$EOA" --unlocked --broadcast --json contracts/MorphoSelfFundedLiquidatorV2.sol:MorphoSelfFundedLiquidatorV2 --constructor-args "$MORPHO" "$UNI_ROUTER" "$AERO_ROUTER")
          LIQUIDATOR=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["deployedTo"])' <<<"$DEPLOY")
          POS=$(cast call "$MORPHO" 'position(bytes32,address)(uint256,uint128,uint128)' "$MARKET" "$BORROWER" --rpc-url "$LOCAL")
          SHARES=$(printf '%s\n' "$POS" | sed -n '2p' | awk '{print $1}')
          COLL=$(printf '%s\n' "$POS" | sed -n '3p' | awk '{print $1}')
          echo "BORROW_SHARES=$SHARES COLLATERAL=$COLL"
          if [ -z "$SHARES" ] || [ "$SHARES" = '0' ]; then
            echo 'LIVE_EXECUTABLE=false' >> "$GITHUB_OUTPUT"
            echo 'LIVE_NET_POSITIVE=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          OWNER_BEFORE=$(cast call "$WETH" 'balanceOf(address)(uint256)' "$EOA" --rpc-url "$LOCAL" | awk '{print $1}')
          set +e
          TX=$(cast send "$LIQUIDATOR" 'execute((address,address,address,address,uint256),address,uint256,uint8,int24,uint256,uint256,bytes32)(uint256)' "($WETH,$WSTETH,$ORACLE,$IRM,$LLTV)" "$BORROWER" "$SHARES" 2 1 0 "$MIN_CONTRACT_PROFIT" "$MARKET" --from "$EOA" --unlocked --rpc-url "$LOCAL" --json 2>&1)
          RC=$?
          set -e
          if [ "$RC" -ne 0 ]; then
            echo "$TX"
            echo 'LIVE_EXECUTABLE=false' >> "$GITHUB_OUTPUT"
            echo 'LIVE_NET_POSITIVE=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          OWNER_AFTER=$(cast call "$WETH" 'balanceOf(address)(uint256)' "$EOA" --rpc-url "$LOCAL" | awk '{print $1}')
          PROFIT=$(python3 -c 'import sys; print(int(sys.argv[1])-int(sys.argv[2]))' "$OWNER_AFTER" "$OWNER_BEFORE")

          read -r GAS_USED EFFECTIVE_GAS_PRICE GAS_COST < <(python3 - "$TX" <<'PY'
          import json, sys
          o=json.loads(sys.argv[1])
          def as_int(v):
              if v is None: return 0
              if isinstance(v, int): return v
              if isinstance(v, str): return int(v, 16) if v.startswith('0x') else int(v)
              return int(v)
          gas=as_int(o.get('gasUsed'))
          price=as_int(o.get('effectiveGasPrice'))
          print(gas, price, gas*price)
          PY
          )
          NET_AFTER_GAS=$(python3 -c 'import sys; print(int(sys.argv[1])-int(sys.argv[2]))' "$PROFIT" "$GAS_COST")
          NET_AFTER_RESERVE=$(python3 -c 'import sys; print(int(sys.argv[1])-int(sys.argv[2]))' "$NET_AFTER_GAS" "$SAFETY_RESERVE_WEI")

          echo "$TX"
          echo "LIVE_EXECUTABLE=true" >> "$GITHUB_OUTPUT"
          echo "PROFIT_WEI=$PROFIT" >> "$GITHUB_OUTPUT"
          echo "GAS_USED=$GAS_USED" >> "$GITHUB_OUTPUT"
          echo "GAS_COST_WEI=$GAS_COST" >> "$GITHUB_OUTPUT"
          echo "NET_AFTER_GAS_WEI=$NET_AFTER_GAS" >> "$GITHUB_OUTPUT"
          echo "NET_AFTER_RESERVE_WEI=$NET_AFTER_RESERVE" >> "$GITHUB_OUTPUT"
          echo "BLOCK=$BLOCK" >> "$GITHUB_OUTPUT"

          if [ "$NET_AFTER_RESERVE" -gt "$MIN_NET_AFTER_RESERVE" ]; then
            echo "LIVE_NET_POSITIVE=true" >> "$GITHUB_OUTPUT"
          else
            echo "LIVE_NET_POSITIVE=false" >> "$GITHUB_OUTPUT"
          fi

          python3 - "$PROFIT" "$GAS_COST" "$NET_AFTER_GAS" "$NET_AFTER_RESERVE" <<'PY'
          import sys
          p,g,n,r=map(int,sys.argv[1:])
          print(f'LIVE_FORK_GROSS_WETH={p/1e18:.9f}')
          print(f'SIMULATED_GAS_COST_WETH={g/1e18:.9f}')
          print(f'NET_AFTER_SIM_GAS_WETH={n/1e18:.9f}')
          print(f'NET_AFTER_0_001_WETH_RESERVE={r/1e18:.9f}')
          PY

      - name: Open one alert issue only when current execution is net-positive
        if: steps.scan.outputs.LIVE_EXECUTABLE == 'true' && steps.scan.outputs.LIVE_NET_POSITIVE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PROFIT_WEI: ${{ steps.scan.outputs.PROFIT_WEI }}
          GAS_COST_WEI: ${{ steps.scan.outputs.GAS_COST_WEI }}
          NET_WEI: ${{ steps.scan.outputs.NET_AFTER_RESERVE_WEI }}
          GAS_USED: ${{ steps.scan.outputs.GAS_USED }}
          BLOCK: ${{ steps.scan.outputs.BLOCK }}
        shell: bash
        run: |
          set -euo pipefail
          EXISTING=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search 'LIVE Morpho wstETH liquidation net-positive in:title' --json number --jq '.[0].number // empty')
          GROSS=$(python3 -c 'import os; print(f"{int(os.environ[\"PROFIT_WEI\"])/1e18:.9f}")')
          GASCOST=$(python3 -c 'import os; print(f"{int(os.environ[\"GAS_COST_WEI\"])/1e18:.9f}")')
          NET=$(python3 -c 'import os; print(f"{int(os.environ[\"NET_WEI\"])/1e18:.9f}")')
          BODY="Current-state Base fork passed the full zero-prefund Morpho → Aerodrome → repayment path at block **${BLOCK}**. Gross: **${GROSS} WETH**. Simulated execution gas (${GAS_USED} gas): **${GASCOST} WETH**. Net after simulated gas and an extra **0.001 WETH** safety reserve: **${NET} WETH**. This is a fork execution signal, not proof of a mainnet fill. Re-simulate current state immediately before any controlled broadcast."
          if [ -z "$EXISTING" ]; then
            gh issue create --repo "$GITHUB_REPOSITORY" --title 'LIVE Morpho wstETH liquidation net-positive' --body "$BODY"
          else
            gh issue comment "$EXISTING" --repo "$GITHUB_REPOSITORY" --body "$BODY"
          fi
