name: 0x Renegade Offset Alias PoC

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/zeroex-renegade-alias-poc.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      BASE_MAINNET_RPC_URL: https://base-mainnet.g.alchemy.com/public
    steps:
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Clone 0x Settler release
        shell: bash
        run: |
          set -euxo pipefail
          git clone --recurse-submodules https://github.com/0xProject/0x-settler.git zeroex
          cd zeroex
          git checkout c65bb8d024077989f8769ca7b6902fd8170ccd61
          git submodule update --init --recursive

      - name: Add local aliasing probes
        shell: bash
        run: |
          set -euxo pipefail
          cd zeroex
          python3 - <<'PY'
          from pathlib import Path
          p = Path('test/utils/RenegadeIntegration.sol')
          s = p.read_text()
          idx = s.rfind('\n}')
          assert idx > 0
          lines = [
              '',
              '    function _probeOptionsOffset(uint256 optionsOffset) internal {',
              '        bytes memory original = _txnCalldata();',
              '        uint256 actualOffset;',
              '        assembly ("memory-safe") { actualOffset := mload(add(0x144, original)) }',
              '        emit log_named_uint("ORIGINAL_OPTIONS_OFFSET", actualOffset);',
              '        emit log_named_uint("PROBE_OPTIONS_OFFSET", optionsOffset);',
              '        bytes memory renegadeData = _compactPayload(_withOptionsOffset(original, optionsOffset));',
              '        bytes memory ahData = _buildExecDataFromPayload(renegadeData, address(settler), type(uint256).max, false, 0, 0, toToken(), 0);',
              '        deal(address(fromToken()), address(this), amount());',
              '        fromToken().approve(address(allowanceHolder), amount());',
              '        try allowanceHolder.exec(address(settler), address(fromToken()), amount(), payable(address(settler)), ahData) {',
              '            emit log_named_uint("ALIAS_EXECUTED", optionsOffset);',
              '            emit log_named_uint("OUTPUT_BALANCE", balanceOf(toToken(), address(this)));',
              '        } catch {',
              '            emit log_named_uint("ALIAS_REVERTED", optionsOffset);',
              '        }',
              '    }',
          ]
          for off in range(0x140, 0x401, 0x20):
              lines.append(f'    function testAliasOffset{off:04x}() public {{ _probeOptionsOffset(0x{off:x}); }}')
          probes = '\n'.join(lines) + '\n'
          p.write_text(s[:idx] + probes + s[idx:])
          PY

      - name: Run Base Renegade alias probes on fork
        shell: bash
        run: |
          set -o pipefail
          cd zeroex
          forge test --match-contract RenegadeBaseIntegrationTest --match-test 'testAliasOffset*' -vv 2>&1 | tee ../zeroex-renegade-alias.log

      - name: Summarize
        if: always()
        shell: bash
        run: |
          echo '=== OFFSET ALIAS SUMMARY ==='
          grep -E 'ORIGINAL_OPTIONS_OFFSET|PROBE_OPTIONS_OFFSET|ALIAS_EXECUTED|ALIAS_REVERTED|OUTPUT_BALANCE' zeroex-renegade-alias.log || true

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zeroex-renegade-alias-poc
          path: zeroex-renegade-alias.log
          retention-days: 14
