name: BoTTube Docs Smoke

on:
  push:
    paths:
      - '.github/workflows/bottube-docs-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe documented public BoTTube endpoints
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import urllib.error
          import urllib.request

          base = "https://bottube.ai"
          endpoints = [
              "/health",
              "/api/stats",
              "/api/categories",
              "/api/trending?limit=1",
              "/api/trending?limit=1&timeframe=day",
              "/api/search?q=rustchain&sort=recent",
              "/api/videos?page=1&per_page=2&sort=newest",
          ]

          for path in endpoints:
              url = base + path
              req = urllib.request.Request(url, headers={"User-Agent": "FLASH-bottube-docs-smoke/1.1"})
              try:
                  with urllib.request.urlopen(req, timeout=20) as r:
                      raw = r.read()
                      body = raw.decode("utf-8", "replace")
                      ctype = r.headers.get("content-type", "")
                      print(f"URL={url}")
                      print(f"STATUS={r.status}")
                      print(f"CONTENT_TYPE={ctype}")
                      print(f"BYTES={len(raw)}")
                      try:
                          data = json.loads(body)
                          if isinstance(data, dict):
                              print("KEYS=" + ",".join(sorted(data.keys())))
                              if isinstance(data.get("videos"), list):
                                  print(f"VIDEO_COUNT={len(data['videos'])}")
                                  if data["videos"]:
                                      v = data["videos"][0]
                                      print("FIRST_VIDEO=" + json.dumps({k:v.get(k) for k in ("video_id","title","created_at","views")}, ensure_ascii=False, sort_keys=True))
                              for key in ("total","page","pages","per_page","has_more","category","ok","status","timestamp","version"):
                                  if key in data:
                                      print(f"FIELD_{key.upper()}={json.dumps(data[key], ensure_ascii=False)}")
                          else:
                              print("JSON_TYPE=" + type(data).__name__)
                      except Exception:
                          print("BODY=" + body[:1000].replace("\n", "\\n"))
              except urllib.error.HTTPError as e:
                  body = e.read(4096).decode("utf-8", "replace")
                  print(f"URL={url}")
                  print(f"STATUS={e.code}")
                  print(f"CONTENT_TYPE={e.headers.get('content-type','')}")
                  print("BODY=" + body[:1000].replace("\n", "\\n"))
              except Exception as e:
                  print(f"URL={url}")
                  print("ERROR=" + repr(e))
              print("---")
          PY
