name: BoTTube Docs Smoke

on:
  push:
    paths:
      - '.github/workflows/bottube-docs-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe documented public BoTTube endpoints
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import urllib.error
          import urllib.parse
          import urllib.request

          base = "https://bottube.ai"
          endpoints = [
              "/health",
              "/api/stats",
              "/api/categories",
              "/api/trending",
              "/api/search?q=rustchain",
              "/api/videos?page=1&per_page=2&sort=newest",
          ]

          for path in endpoints:
              url = base + path
              req = urllib.request.Request(url, headers={"User-Agent": "FLASH-bottube-docs-smoke/1.0"})
              try:
                  with urllib.request.urlopen(req, timeout=20) as r:
                      body = r.read(4096).decode("utf-8", "replace")
                      ctype = r.headers.get("content-type", "")
                      print(f"URL={url}")
                      print(f"STATUS={r.status}")
                      print(f"CONTENT_TYPE={ctype}")
                      try:
                          data = json.loads(body)
                          print("JSON=" + json.dumps(data, ensure_ascii=False, sort_keys=True)[:3500])
                      except Exception:
                          print("BODY=" + body[:1000].replace("\n", "\\n"))
              except urllib.error.HTTPError as e:
                  body = e.read(4096).decode("utf-8", "replace")
                  print(f"URL={url}")
                  print(f"STATUS={e.code}")
                  print(f"CONTENT_TYPE={e.headers.get('content-type','')}")
                  print("BODY=" + body[:1000].replace("\n", "\\n"))
              except Exception as e:
                  print(f"URL={url}")
                  print("ERROR=" + repr(e))
              print("---")
          PY
