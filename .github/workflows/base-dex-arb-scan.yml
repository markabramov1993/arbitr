name: Base DEX Arb Scan

on:
  push:
    branches: [profit-engine-v07]
    paths:
      - 'scripts/base_dex_arb_scan.py'
      - 'scripts/base_dex_spread_quick.py'
      - 'scripts/cbbtc_focused_quote.py'
      - '.github/workflows/base-dex-arb-scan.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-cbbtc:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Quote cbBTC Uniswap-Aerodrome roundtrips
        shell: bash
        run: python3 scripts/cbbtc_focused_quote.py | tee cbbtc-focused-quote.jsonl
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cbbtc-focused-quote-evidence
          path: cbbtc-focused-quote.jsonl
          retention-days: 30
