name: Base DEX Arb Scan

on:
  push:
    branches: [profit-engine-v07]
    paths:
      - 'scripts/base_dex_arb_scan.py'
      - 'scripts/base_dex_spread_quick.py'
      - 'scripts/cbbtc_focused_quote.py'
      - 'test/CbBtcArbFork.t.sol'
      - '.github/workflows/base-dex-arb-scan.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-matrix:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Fast live spot-spread shortlist
        shell: bash
        run: |
          set -o pipefail
          python3 scripts/base_dex_spread_quick.py 2>&1 | tee base-dex-spread-quick.log
      - name: Live Quoter matrix across WETH cbBTC cbXRP and sizes
        shell: bash
        run: |
          set -o pipefail
          python3 scripts/base_dex_arb_scan.py 2>&1 | tee base-dex-arb-matrix.log
      - name: Print only positive gross candidates
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          rows=[]
          try:
              lines=open('base-dex-arb-matrix.log',encoding='utf-8').read().splitlines()
          except FileNotFoundError:
              lines=[]
          for line in lines:
              try: o=json.loads(line)
              except Exception: continue
              if o.get('kind')=='route' and float(o.get('gross_pnl',0))>0:
                  rows.append(o)
          rows.sort(key=lambda x: float(x['gross_pnl']), reverse=True)
          print('POSITIVE_GROSS_COUNT=',len(rows))
          for r in rows[:20]: print('POSITIVE=',json.dumps(r,separators=(',',':')))
          PY
      - name: Upload live matrix evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: base-dex-live-matrix
          path: |
            base-dex-spread-quick.log
            base-dex-arb-matrix.log
          retention-days: 14

  cbBTC-fork:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Build
        run: forge build
      - name: Execute real Uniswap to Aerodrome swaps on Base fork
        id: fork_scan
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          forge test --match-contract CbBtcArbForkTest -vv 2>&1 | tee cbbtc-fork.txt
      - name: Validate fork scan health and summarize outcomes
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import re, sys
          from pathlib import Path
          p=Path('cbbtc-fork.txt')
          if not p.exists():
              print('FORK_SCAN_HEALTH=FAIL no evidence file')
              sys.exit(1)
          text=p.read_text(encoding='utf-8', errors='replace')
          passed=len(re.findall(r'^\[PASS\]', text, re.M))
          failed=len(re.findall(r'^\[FAIL:', text, re.M))
          pnl=[int(x) for x in re.findall(r'grossPnl_USDC_6dec:\s*(-?\d+)', text)]
          positives=[x for x in pnl if x>0]
          rate_limited='HTTP error 429' in text
          print(f'FORK_PASS_COUNT={passed}')
          print(f'FORK_REVERT_COUNT={failed}')
          print(f'FORK_RATE_LIMITED={str(rate_limited).lower()}')
          print(f'FORK_POSITIVE_PNL_COUNT={len(positives)}')
          if pnl:
              print(f'FORK_BEST_GROSS_PNL_USDC_6DEC={max(pnl)}')
          # A scan is healthy when at least one fork case executed successfully.
          # Individual size reverts/negative PnL are candidate rejection, not CI failure.
          if passed < 1:
              print('FORK_SCAN_HEALTH=FAIL no successful executable size')
              sys.exit(1)
          print('FORK_SCAN_HEALTH=OK')
          PY
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cbbtc-fork-evidence
          path: cbbtc-fork.txt
          retention-days: 30

