name: Base DEX Arb Scan

on:
  push:
    branches: [profit-engine-v07]
    paths:
      - 'scripts/base_dex_arb_scan.py'
      - 'scripts/base_dex_spread_quick.py'
      - '.github/workflows/base-dex-arb-scan.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quick-spread:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Fast Uniswap vs Aerodrome spread shortlist
        shell: bash
        run: python3 scripts/base_dex_spread_quick.py | tee base-dex-spread.jsonl
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: base-dex-spread-evidence
          path: base-dex-spread.jsonl
          retention-days: 30
