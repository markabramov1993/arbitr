name: Profit Engine Free CI

on:
  push:
    branches: [profit-engine-v07]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  forge-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Build Solidity harness
        run: forge build
      - name: Inspect live Base SVR aggregators
        shell: bash
        run: |
          set +e
          RPC='https://mainnet.base.org'
          for A in \
            0x83f3425A5b32655DC645f7f4e422DD60E9741794 \
            0xD772F6D9b7A35cb96fDdFE569964ab1C05017BF9 \
            0xeb3Ad4395924b76eB64b3d6aBabA0B62875b1A1f; do
            echo "=== $A ==="
            echo -n 'description: '; cast call "$A" 'description()(string)' --rpc-url "$RPC" || true
            echo -n 'typeAndVersion: '; cast call "$A" 'typeAndVersion()(string)' --rpc-url "$RPC" || true
            echo -n 'decimals: '; cast call "$A" 'decimals()(uint8)' --rpc-url "$RPC" || true
            echo -n 'latestAnswer: '; cast call "$A" 'latestAnswer()(int256)' --rpc-url "$RPC" || true
            echo -n 'latestRoundData: '; cast call "$A" 'latestRoundData()(uint80,int256,uint256,uint256,uint80)' --rpc-url "$RPC" || true
          done

  free-base-rpc:
    runs-on: ubuntu-latest
    steps:
      - name: Check public Base RPC endpoints with failover
        shell: bash
        run: |
          set -euo pipefail
          payload='{"jsonrpc":"2.0","id":1,"method":"eth_chainId","params":[]}'
          block_payload='{"jsonrpc":"2.0","id":2,"method":"eth_blockNumber","params":[]}'
          ok=0
          for url in https://mainnet.base.org https://base-mainnet.g.alchemy.com/public; do
            echo "Checking $url"
            response=$(curl --fail --silent --show-error --max-time 15 -H 'content-type: application/json' --data "$payload" "$url" || true)
            if echo "$response" | grep -qi '"result"[[:space:]]*:[[:space:]]*"0x2105"'; then
              block=$(curl --fail --silent --show-error --max-time 15 -H 'content-type: application/json' --data "$block_payload" "$url" || true)
              echo "Base RPC healthy: $url; block response: $block"
              ok=1
              break
            fi
            echo "RPC unavailable/rate-limited or wrong chain: $response"
          done
          test "$ok" -eq 1
