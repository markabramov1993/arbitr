name: RTC Payout Watch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rtc-payout-watch.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - name: Check RustChain wallet
        shell: bash
        run: |
          set -euo pipefail
          WALLET='RTC7558d7acadad7a32a710459a4c16c0fc1c56f43d'
          echo '=== BALANCE ==='
          curl -kfsS --retry 2 --connect-timeout 10 "https://rustchain.org/wallet/balance?miner_id=${WALLET}" || true
          echo
          echo '=== HISTORY ==='
          curl -kfsS --retry 2 --connect-timeout 10 "https://rustchain.org/wallet/history?miner_id=${WALLET}&limit=50" || true
          echo

# FLASH payout refresh: 2026-09-06
