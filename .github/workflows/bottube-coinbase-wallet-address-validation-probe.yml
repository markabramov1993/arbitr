name: BoTTube Coinbase Wallet Address Validation Probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bottube-coinbase-wallet-address-validation-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Checkout current BoTTube main
        run: |
          git clone --depth 1 https://github.com/Scottcjn/bottube.git bottube
          cd bottube
          git rev-parse HEAD | tee ../bottube-upstream-sha.txt

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install minimal test dependency
        run: python -m pip install Flask

      - name: Reproduce wallet-address validation gap locally
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH="$PWD/bottube" python - <<'PY' | tee coinbase-wallet-validation.txt
          import os
          import sqlite3
          import tempfile
          from flask import Flask

          fd, db_path = tempfile.mkstemp(suffix='.db')
          os.close(fd)
          try:
              with sqlite3.connect(db_path) as db:
                  db.execute('''CREATE TABLE agents (
                      id INTEGER PRIMARY KEY,
                      agent_name TEXT NOT NULL,
                      display_name TEXT,
                      api_key TEXT UNIQUE NOT NULL
                  )''')
                  db.execute(
                      'INSERT INTO agents(id, agent_name, display_name, api_key) VALUES(1,?,?,?)',
                      ('probe-agent', 'Probe Agent', 'probe-secret'),
                  )
                  db.commit()

              from bottube_x402 import init_app
              app = Flask(__name__)
              app.config['TESTING'] = True
              init_app(app, db_path)
              client = app.test_client()

              valid = '0x' + ('a' * 40)
              invalid_nonhex = '0x' + ('Z' * 40)

              control = client.post(
                  '/api/agents/me/coinbase-wallet',
                  headers={'Authorization': 'Bearer probe-secret'},
                  json={'coinbase_address': valid},
              )
              print('CONTROL_STATUS=', control.status_code)
              print('CONTROL_JSON=', control.get_json())
              assert control.status_code == 200, 'valid control address was rejected'

              repro = client.post(
                  '/api/agents/me/coinbase-wallet',
                  headers={'Authorization': 'Bearer probe-secret'},
                  json={'coinbase_address': invalid_nonhex},
              )
              print('NONHEX_STATUS=', repro.status_code)
              print('NONHEX_JSON=', repro.get_json())

              with sqlite3.connect(db_path) as db:
                  persisted = db.execute(
                      'SELECT coinbase_address FROM agents WHERE id=1'
                  ).fetchone()[0]
              print('PERSISTED_ADDRESS=', persisted)

              assert repro.status_code == 200, (
                  'Upstream behavior changed: non-hex address no longer accepted; '
                  'do not file the report.'
              )
              assert persisted == invalid_nonhex, 'invalid address was not persisted as expected'
              print('BUG_REPRODUCED=true')
          finally:
              try:
                  os.unlink(db_path)
              except FileNotFoundError:
                  pass
          PY

      - name: Upload reproduction evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bottube-coinbase-wallet-address-validation
          path: |
            bottube-upstream-sha.txt
            coinbase-wallet-validation.txt
          retention-days: 30
