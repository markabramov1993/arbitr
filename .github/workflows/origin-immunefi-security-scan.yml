name: Origin Immunefi Readonly Security Scan

on:
  push:
    paths:
      - '.github/workflows/origin-immunefi-security-scan.yml'
  schedule:
    - cron: '37 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  slither:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout Profit Engine
        uses: actions/checkout@v4

      - name: Checkout fresh Origin Dollar upstream
        run: |
          git clone --depth 1 https://github.com/OriginProtocol/origin-dollar.git origin-dollar
          cd origin-dollar
          git rev-parse HEAD | tee ../origin-upstream-sha.txt

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Slither and pnpm
        run: |
          python -m pip install --upgrade pip
          python -m pip install slither-analyzer
          corepack enable
          corepack prepare pnpm@10.18.3 --activate

      - name: Install Origin dependencies
        working-directory: origin-dollar/contracts
        run: pnpm install --frozen-lockfile

      - name: Run upstream Slither profile
        id: slither
        working-directory: origin-dollar/contracts
        continue-on-error: true
        run: |
          set -o pipefail
          pnpm run slither 2>&1 | tee ../../origin-slither.log

      - name: Summarize evidence
        run: |
          echo "UPSTREAM_SHA=$(cat origin-upstream-sha.txt)"
          echo "SLITHER_OUTCOME=${{ steps.slither.outcome }}"
          echo '--- detector summary ---'
          grep -Ei '(^| )(high|medium|reentr|arbitrary|delegatecall|uninitialized|dangerous|incorrect|shadow|controlled|suicid|selfdestruct|price|oracle)' origin-slither.log | tail -n 160 || true
          echo '--- end summary ---'

      - name: Upload security evidence
        uses: actions/upload-artifact@v4
        with:
          name: origin-immunefi-readonly-scan
          path: |
            origin-upstream-sha.txt
            origin-slither.log
          retention-days: 14
          if-no-files-found: warn
