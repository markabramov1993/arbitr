name: Origin Immunefi Readonly Security Scan

on:
  push:
    paths:
      - '.github/workflows/origin-immunefi-security-scan.yml'
  schedule:
    - cron: '37 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  slither:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout Profit Engine
        uses: actions/checkout@v4

      - name: Checkout fresh Origin Dollar upstream
        run: |
          git clone --depth 1 https://github.com/OriginProtocol/origin-dollar.git origin-dollar
          cd origin-dollar
          git rev-parse HEAD | tee ../origin-upstream-sha.txt

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Origin-pinned Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.1

      - name: Install Slither and pnpm
        run: |
          python -m pip install --upgrade pip
          python -m pip install slither-analyzer
          corepack enable
          corepack prepare pnpm@10.18.3 --activate
          forge --version
          slither --version

      - name: Configure GitHub dependencies over HTTPS
        run: |
          git config --global --unset-all url."https://github.com/".insteadOf || true
          git config --global --add url."https://github.com/".insteadOf "git@github.com:"
          git config --global --add url."https://github.com/".insteadOf "ssh://git@github.com/"

      - name: Install Origin Solidity and Node dependencies
        working-directory: origin-dollar/contracts
        run: |
          # Use Origin's own bootstrap: Soldeer-managed dependencies plus the
          # Chainlink CCIP tgz that Soldeer cannot extract.
          ./install-deps.sh
          pnpm install --frozen-lockfile
          test -f dependencies/@openzeppelin-contracts-4.4.2/contracts/token/ERC20/IERC20.sol
          test -f dependencies/@chainlink-contracts-ccip-1.2.1/package/src/v0.8/ccip/libraries/Client.sol

      - name: Run upstream Slither profile
        id: slither
        working-directory: origin-dollar/contracts
        continue-on-error: true
        run: |
          set -o pipefail
          pnpm run slither 2>&1 | tee ../../origin-slither.log

      - name: Summarize evidence
        if: always()
        run: |
          echo "UPSTREAM_SHA=$(cat origin-upstream-sha.txt 2>/dev/null || echo unknown)"
          echo "SLITHER_OUTCOME=${{ steps.slither.outcome }}"
          echo '--- detector summary ---'
          if [ -f origin-slither.log ]; then
            grep -Ei '(^| )(high|medium|reentr|arbitrary|delegatecall|uninitialized|dangerous|incorrect|shadow|controlled|suicid|selfdestruct|price|oracle)' origin-slither.log | tail -n 160 || true
          else
            echo 'No Slither log produced.'
          fi
          echo '--- end summary ---'

      - name: Upload security evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: origin-immunefi-readonly-scan
          path: |
            origin-upstream-sha.txt
            origin-slither.log
          retention-days: 14
          if-no-files-found: warn

      - name: Require real Slither completion
        if: always()
        shell: bash
        run: |
          if [ "${{ steps.slither.outcome }}" != "success" ]; then
            echo 'SECURITY_SCAN_HEALTH=FAIL Slither did not complete successfully'
            exit 1
          fi
          if ! grep -Eq 'analyzed|contracts? analyzed|INFO:Slither|INFO:Detectors' origin-slither.log; then
            echo 'SECURITY_SCAN_HEALTH=FAIL no Slither completion evidence'
            exit 1
          fi
          echo 'SECURITY_SCAN_HEALTH=OK'
