name: Superteam Public Detail

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/superteam-public-detail.yml'

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Fetch full public listing records with endpoint fallbacks
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, urllib.request, urllib.error
          slugs=['steve-agent-arena-launch-your-agent-and-win-500-usdc','zns-sol']
          bases=['https://earn.superteam.fun','https://superteam.fun']
          paths=['/api/listings/details/{slug}','/api/listings/{slug}']
          for slug in slugs:
              print('===',slug,'===')
              found=None
              for base in bases:
                  for pattern in paths:
                      url=base+pattern.format(slug=slug)
                      try:
                          req=urllib.request.Request(url,headers={'User-Agent':'profit-engine-public-detail/1.0'})
                          with urllib.request.urlopen(req,timeout=20) as r:
                              body=r.read(); status=r.status
                      except urllib.error.HTTPError as e:
                          status=e.code; body=e.read()
                      except Exception as e:
                          print('TRY',url,'-> ERROR',repr(e)); continue
                      print('TRY',url,'->',status)
                      if status==200:
                          found=json.loads(body)
                          break
                  if found is not None: break
              if found is None:
                  found={'error':'detail endpoints unavailable'}
              with open(slug+'.json','w') as f: json.dump(found,f,ensure_ascii=False,indent=2)
              print(json.dumps(found,ensure_ascii=False,indent=2)[:60000])
          PY
      - name: Upload details
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: superteam-public-details
          path: |
            steve-agent-arena-launch-your-agent-and-win-500-usdc.json
            zns-sol.json
          retention-days: 7
