name: Base Morpho Partial Liquidation Optimizer

on:
  workflow_dispatch:
  push:
    branches: [profit-engine-v07]
    paths: ['.github/workflows/base-morpho-partial-optimizer.yml']

permissions:
  contents: read

jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: foundry-rs/foundry-toolchain@v1
        with: {version: stable}
      - name: Find profitable partial liquidation size on current near-threshold wstETH/WETH position
        shell: bash
        run: |
          set -euo pipefail
          REMOTE='https://base-mainnet.g.alchemy.com/public'; LOCAL='http://127.0.0.1:8545'
          MORPHO='0xBBBBBbbBBb9cC5e90e3b3Af64bdAF62C37EEFFCb'
          WETH='0x4200000000000000000000000000000000000006'; WSTETH='0xc1CBa3fCea344f92D9239c08C0568f6F2F0ee452'
          ORACLE='0xaE10cbdAa587646246c8253E4532A002EE4fa7A4'; IRM='0x46415998764C29aB2a25CbeA6254146D50D22687'; LLTV='965000000000000000'
          MARKET='0x6aa81f51dfc955df598e18006deae56ce907ac02b0b5358705f1a28fcea23cc0'; BORROWER='0x10c53e75fE7A7E6bF58a9e68B6a30Fcc7D4e6e2c'
          FACTORY='0x33128a8fC17869897dcE68Ed026d694621f6FDfD'; QUOTER='0x3d4e44Eb1374240CE5F1B871ab261CD16335B76a'
          EOA='0xf39Fd6e51aad88F6F4ce6aB8827279cffFb92266'; MAX='0xffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffff'

          anvil --fork-url "$REMOTE" --chain-id 8453 --port 8545 --silent >/tmp/anvil.log 2>&1 & PID=$!; trap 'kill $PID 2>/dev/null || true' EXIT
          for i in {1..30}; do cast block-number --rpc-url "$LOCAL" >/dev/null 2>&1 && break; sleep 1; done
          echo "FORK_BLOCK=$(cast block-number --rpc-url "$LOCAL")"
          cast send "$WETH" 'deposit()' --value 100ether --from "$EOA" --unlocked --rpc-url "$LOCAL" >/dev/null
          cast send "$WETH" 'approve(address,uint256)' "$MORPHO" "$MAX" --from "$EOA" --unlocked --rpc-url "$LOCAL" >/dev/null

          # Advance only enough to make the current real position eligible on the fork.
          ELIGIBLE_DAY=-1
          for DAY in $(seq 0 20); do
            if [ "$DAY" -gt 0 ]; then cast rpc evm_increaseTime 86400 --rpc-url "$LOCAL" >/dev/null; cast rpc evm_mine --rpc-url "$LOCAL" >/dev/null; fi
            POS=$(cast call "$MORPHO" 'position(bytes32,address)(uint256,uint128,uint128)' "$MARKET" "$BORROWER" --rpc-url "$LOCAL")
            SHARES=$(printf '%s\n' "$POS" | sed -n '2p' | awk '{print $1}')
            TEST_SHARES=$(python3 -c 'import sys; print(max(1,int(sys.argv[1])//100))' "$SHARES")
            SNAP=$(cast rpc evm_snapshot --rpc-url "$LOCAL" | tr -d '"')
            set +e
            cast send "$MORPHO" 'liquidate((address,address,address,address,uint256),address,uint256,uint256,bytes)' "($WETH,$WSTETH,$ORACLE,$IRM,$LLTV)" "$BORROWER" 0 "$TEST_SHARES" 0x --from "$EOA" --unlocked --rpc-url "$LOCAL" --json >/tmp/probe.json 2>/tmp/probe.err
            RC=$?
            set -e
            cast rpc evm_revert "$SNAP" --rpc-url "$LOCAL" >/dev/null
            if [ "$RC" -eq 0 ]; then ELIGIBLE_DAY=$DAY; break; fi
          done
          echo "ELIGIBLE_DAY=$ELIGIBLE_DAY"
          if [ "$ELIGIBLE_DAY" -lt 0 ]; then echo 'NO_ELIGIBLE_STATE'; exit 0; fi

          POS=$(cast call "$MORPHO" 'position(bytes32,address)(uint256,uint128,uint128)' "$MARKET" "$BORROWER" --rpc-url "$LOCAL")
          TOTAL_SHARES=$(printf '%s\n' "$POS" | sed -n '2p' | awk '{print $1}')
          echo "TOTAL_BORROW_SHARES=$TOTAL_SHARES"
          GAS_PRICE=$(cast gas-price --rpc-url "$REMOTE" | awk '{print $1}')
          echo "REMOTE_GAS_PRICE_WEI=$GAS_PRICE"

          : >/tmp/results.tsv
          for PCT in 1 2 5 10 15 20 25 30 35 40 50 60 70 80 90 100; do
            PART=$(python3 -c 'import sys; print(max(1,int(sys.argv[1])*int(sys.argv[2])//100))' "$TOTAL_SHARES" "$PCT")
            SNAP=$(cast rpc evm_snapshot --rpc-url "$LOCAL" | tr -d '"')
            WB=$(cast call "$WETH" 'balanceOf(address)(uint256)' "$EOA" --rpc-url "$LOCAL" | awk '{print $1}')
            CB=$(cast call "$WSTETH" 'balanceOf(address)(uint256)' "$EOA" --rpc-url "$LOCAL" | awk '{print $1}')
            set +e
            cast send "$MORPHO" 'liquidate((address,address,address,address,uint256),address,uint256,uint256,bytes)' "($WETH,$WSTETH,$ORACLE,$IRM,$LLTV)" "$BORROWER" 0 "$PART" 0x --from "$EOA" --unlocked --rpc-url "$LOCAL" --json >/tmp/liq.json 2>/tmp/liq.err
            RC=$?
            set -e
            if [ "$RC" -ne 0 ]; then
              echo -e "$PCT\tREVERT\t0\t0\t0\t0\t0" >>/tmp/results.tsv
              cast rpc evm_revert "$SNAP" --rpc-url "$LOCAL" >/dev/null
              continue
            fi
            WA=$(cast call "$WETH" 'balanceOf(address)(uint256)' "$EOA" --rpc-url "$LOCAL" | awk '{print $1}')
            CA=$(cast call "$WSTETH" 'balanceOf(address)(uint256)' "$EOA" --rpc-url "$LOCAL" | awk '{print $1}')
            REPAY=$(python3 -c 'import sys; print(int(sys.argv[1])-int(sys.argv[2]))' "$WB" "$WA")
            SEIZED=$(python3 -c 'import sys; print(int(sys.argv[1])-int(sys.argv[2]))' "$CA" "$CB")
            cast rpc evm_revert "$SNAP" --rpc-url "$LOCAL" >/dev/null

            BEST_OUT=0; BEST_FEE=0
            for FEE in 100 500 3000 10000; do
              POOL=$(cast call "$FACTORY" 'getPool(address,address,uint24)(address)' "$WSTETH" "$WETH" "$FEE" --rpc-url "$LOCAL" 2>/dev/null || true)
              [ "$POOL" != '0x0000000000000000000000000000000000000000' ] || continue
              set +e
              Q=$(cast call "$QUOTER" 'quoteExactInputSingle((address,address,uint256,uint24,uint160))(uint256,uint160,uint32,uint256)' "($WSTETH,$WETH,$SEIZED,$FEE,0)" --rpc-url "$LOCAL" 2>/dev/null); QRC=$?
              set -e
              if [ "$QRC" -eq 0 ]; then
                OUT=$(printf '%s\n' "$Q" | sed -n '1p' | awk '{print $1}')
                if python3 -c 'import sys; raise SystemExit(0 if int(sys.argv[1])>int(sys.argv[2]) else 1)' "$OUT" "$BEST_OUT"; then BEST_OUT=$OUT; BEST_FEE=$FEE; fi
              fi
            done
            GROSS=$(python3 -c 'import sys; print(int(sys.argv[1])-int(sys.argv[2]))' "$BEST_OUT" "$REPAY")
            # Conservative reserve: 900k gas plus 0.005 WETH to absorb Base L1 data / quote drift.
            RESERVE=$(python3 -c 'import sys; print(900000*int(sys.argv[1])+5_000_000_000_000_000)' "$GAS_PRICE")
            NET=$(python3 -c 'import sys; print(int(sys.argv[1])-int(sys.argv[2]))' "$GROSS" "$RESERVE")
            echo -e "$PCT\tOK\t$REPAY\t$SEIZED\t$BEST_OUT\t$GROSS\t$NET\t$BEST_FEE" >>/tmp/results.tsv
          done

          cat /tmp/results.tsv
          python3 - <<'PY'
          rows=[]
          with open('/tmp/results.tsv') as f:
              for line in f:
                  p=line.rstrip().split('\t')
                  if len(p)<8 or p[1]!='OK': continue
                  pct=int(p[0]); repay=int(p[2]); seized=int(p[3]); out=int(p[4]); gross=int(p[5]); net=int(p[6]); fee=int(p[7])
                  rows.append((net,gross,pct,repay,seized,out,fee))
          if not rows:
              print('NO_SUCCESSFUL_PARTIAL_LIQUIDATIONS'); raise SystemExit
          rows.sort(reverse=True)
          net,gross,pct,repay,seized,out,fee=rows[0]
          print('=== BEST PARTIAL ===')
          print(f'PERCENT={pct}')
          print(f'REPAY_WETH={repay/1e18:.9f}')
          print(f'SEIZED_WSTETH={seized/1e18:.9f}')
          print(f'EXIT_WETH={out/1e18:.9f}')
          print(f'GROSS_WETH={gross/1e18:.9f}')
          print(f'NET_AFTER_RESERVE_WETH={net/1e18:.9f}')
          print(f'UNISWAP_FEE_TIER={fee}')
          print('PARTIAL_EXECUTABLE_SCREEN=' + ('true' if net>0 else 'false'))
          PY
