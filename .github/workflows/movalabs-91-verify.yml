name: Verify Mova Labs #91

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/movalabs-91-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Clone exact PR #257 head
        run: |
          git clone --depth 1 --branch fix/issue-91-lifecycle-events https://github.com/markabramov1993/mova-store.git target
          cd target
          echo "PR_HEAD=$(git rev-parse HEAD)"
      - name: Show issue-scope diff
        working-directory: target
        run: |
          git diff --stat origin/main...HEAD || true
          git show --stat --oneline --decorate HEAD
      - name: Run checkout contract tests
        working-directory: target/contracts/checkout
        run: cargo test
