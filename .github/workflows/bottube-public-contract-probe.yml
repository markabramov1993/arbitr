name: BoTTube Public Contract Probe

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/bottube-public-contract-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe public read-only API shapes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, urllib.request

          endpoints = [
              '/api/trending?limit=2',
              '/api/feed?page=1&per_page=2',
              '/api/search?q=rustchain',
              '/api/tags',
              '/api/footer-counters',
          ]
          base = 'https://bottube.ai'
          for path in endpoints:
              print('===', path, '===')
              req = urllib.request.Request(base + path, headers={'User-Agent':'FLASH-readonly-contract-probe/1.0'})
              try:
                  with urllib.request.urlopen(req, timeout=20) as r:
                      raw = r.read().decode('utf-8', 'replace')
                      print('HTTP', r.status)
                      try:
                          data = json.loads(raw)
                          if isinstance(data, dict):
                              print('TOP_KEYS', sorted(data.keys()))
                              for k, v in data.items():
                                  if isinstance(v, list):
                                      print('LIST', k, 'len=', len(v), 'first_keys=', sorted(v[0].keys()) if v and isinstance(v[0], dict) else None)
                                  elif isinstance(v, (str, int, float, bool)) or v is None:
                                      print('SCALAR', k, '=', repr(v))
                          else:
                              print('TYPE', type(data).__name__)
                      except Exception:
                          print('NON_JSON', raw[:500])
              except Exception as e:
                  print('ERROR', type(e).__name__, str(e))
          PY
