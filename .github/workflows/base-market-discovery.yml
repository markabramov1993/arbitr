name: Base Live V2 Market Discovery

on:
  workflow_dispatch:
  push:
    branches: [profit-engine-v07]
    paths:
      - '.github/workflows/base-market-discovery.yml'

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Batch-read pools and calculate round-trip edges
        shell: bash
        run: |
          set -euo pipefail
          export RPC_PRIMARY=https://base-mainnet.g.alchemy.com/public
          export RPC_FALLBACK=https://mainnet.base.org
          export WETH=0x4200000000000000000000000000000000000006
          export USDC=0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913
          # Discovered on-chain in run 33838436076, then revalidated every run by token0/token1 calls.
          export UNI_PAIR=0x88A43bbDF9D098eEC7bCEda4e2494615dfD9bB9C
          export PANCAKE_PAIR=0x79474223AEdD0339780baCcE75aBDa0BE84dcBF9
          export SUSHI_PAIR=0x2F8818D1B0f3e3E295440c1C0cDDf40aAA21fA87
          export AAVE_POOL=0xA238Dd80C259a72e81d7e4664a9801593F98d1c5
          export FLASH_SEL=$(cast sig 'FLASHLOAN_PREMIUM_TOTAL()')

          python3 - <<'PY'
          import os, json, urllib.request, urllib.error, subprocess

          urls=[os.environ['RPC_PRIMARY'], os.environ['RPC_FALLBACK']]
          WETH=os.environ['WETH'].lower(); USDC=os.environ['USDC'].lower()
          AAVE=os.environ['AAVE_POOL']; flash_sel=os.environ['FLASH_SEL']
          pairs=[
              ('uniswap_v2', os.environ['UNI_PAIR'], 30),
              ('pancake_v2', os.environ['PANCAKE_PAIR'], 25),
              ('sushi_v2', os.environ['SUSHI_PAIR'], 30),
          ]

          reqs=[
              {'jsonrpc':'2.0','id':'block','method':'eth_blockNumber','params':[]},
              {'jsonrpc':'2.0','id':'gas','method':'eth_gasPrice','params':[]},
              {'jsonrpc':'2.0','id':'flash','method':'eth_call','params':[{'to':AAVE,'data':flash_sel},'latest']},
          ]
          for name,pair,fee in pairs:
              reqs += [
                  {'jsonrpc':'2.0','id':name+':t0','method':'eth_call','params':[{'to':pair,'data':'0x0dfe1681'},'latest']},
                  {'jsonrpc':'2.0','id':name+':t1','method':'eth_call','params':[{'to':pair,'data':'0xd21220a7'},'latest']},
                  {'jsonrpc':'2.0','id':name+':res','method':'eth_call','params':[{'to':pair,'data':'0x0902f1ac'},'latest']},
              ]

          last_err=None
          for url in urls:
              try:
                  data=json.dumps(reqs).encode()
                  r=urllib.request.Request(url,data=data,headers={'content-type':'application/json','user-agent':'profit-engine-v07'})
                  with urllib.request.urlopen(r,timeout=20) as resp:
                      body=json.loads(resp.read())
                  if not isinstance(body,list): raise RuntimeError(f'non-batch response {body}')
                  by={x['id']:x for x in body}
                  if any('error' in x for x in body):
                      raise RuntimeError(str([x for x in body if 'error' in x]))
                  print('RPC='+url)
                  break
              except Exception as e:
                  last_err=e; print(f'RPC failed {url}: {e}')
          else:
              raise SystemExit(f'all RPC endpoints failed: {last_err}')

          def result(i): return by[i]['result']
          def addr(raw): return '0x'+raw[-40:].lower()
          def words(raw):
              h=raw[2:]
              return [int(h[i:i+64],16) for i in range(0,len(h),64)]

          block=int(result('block'),16); gas_price=int(result('gas'),16); flash_bps=int(result('flash'),16)
          print(f'BLOCK={block} GAS_PRICE_WEI={gas_price} AAVE_FLASH_PREMIUM_BPS={flash_bps}')
          states={}
          for name,pair,fee in pairs:
              t0=addr(result(name+':t0')); t1=addr(result(name+':t1'))
              r0,r1,_=words(result(name+':res'))[:3]
              if {t0,t1}!={WETH,USDC}:
                  print(f'{name}: rejected unexpected tokens {t0} {t1}')
                  continue
              rw=r0 if t0==WETH else r1; ru=r0 if t0==USDC else r1
              if rw==0 or ru==0:
                  print(f'{name}: zero liquidity'); continue
              price=(ru/1e6)/(rw/1e18)
              states[name]={'pair':pair,'rw':rw,'ru':ru,'fee':fee,'price':price}
              print(f'{name}: pair={pair} WETH={rw/1e18:.6f} USDC={ru/1e6:.2f} mid=${price:.6f}/WETH fee={fee/100:.2f}%')

          def swap(amount,res_in,res_out,fee_bps):
              a=amount*(10000-fee_bps)
              return (a*res_out)//(res_in*10000+a)

          best=None
          amounts=[5,10,25,50,100,250,500,1000,2500,5000,10000,25000]
          for a,A in states.items():
              for b,B in states.items():
                  if a==b: continue
                  for usd in amounts:
                      inp=int(usd*1e6)
                      weth=swap(inp,A['ru'],A['rw'],A['fee'])
                      out=swap(weth,B['rw'],B['ru'],B['fee'])
                      gross=(out-inp)/1e6
                      eth_price=(A['price']+B['price'])/2
                      gas_usd=350_000*gas_price/1e18*eth_price + 0.05
                      flash=usd*flash_bps/10000
                      net=gross-gas_usd-flash
                      row={'route':f'USDC->{a}:WETH->{b}:USDC','input_usdc':usd,'intermediate_weth':weth/1e18,'output_usdc':out/1e6,'gross_usd':gross,'aave_flash_fee_usd':flash,'gas_plus_l1_reserve_usd':gas_usd,'estimated_net_usd':net}
                      if best is None or row['estimated_net_usd']>best['estimated_net_usd']: best=row

          print('\n=== BEST STATIC V2 ROUNDTRIP ===')
          if best is None:
              print('No usable venue pair.')
          else:
              best['block']=block; best['note']='static same-block reserve research; not realized P&L'
              print(json.dumps(best,indent=2))
              print('CANDIDATE_NET_POSITIVE=' + ('yes' if best['estimated_net_usd']>0 else 'no'))
          PY
