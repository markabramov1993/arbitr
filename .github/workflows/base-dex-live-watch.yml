name: Base DEX Live Watch

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/base_dex_live_scan.py'
      - 'scripts/generate_base_dex_fork_test.py'
      - '.github/workflows/base-dex-live-watch.yml'

permissions:
  contents: read

concurrency:
  group: base-dex-live-watch
  cancel-in-progress: true

jobs:
  scan-and-fork:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Read-only spot-edge scan
        shell: bash
        run: |
          set -o pipefail
          python3 scripts/base_dex_live_scan.py 2>&1 | tee base-dex-live-scan.jsonl
          echo '=== SCAN SUMMARY ==='
          grep '"kind":"summary"' base-dex-live-scan.jsonl | tail -1 || true

      - name: Generate fork execution search
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dexwatch
          forge init dexwatch --force --empty >/dev/null
          python3 scripts/generate_base_dex_fork_test.py base-dex-live-scan.jsonl dexwatch/test/GeneratedBaseDexArb.t.sol | tee dex-generator.log
          echo '=== SHORTLIST ==='
          cat dex-candidate.json

      - name: Execute shortlisted routes on independent fresh Base forks
        shell: bash
        run: |
          set +e
          set -o pipefail
          cd dexwatch
          forge test --match-contract GeneratedBaseDexArbTest -vv 2>&1 | tee ../base-dex-fork-validation.log
          RC=${PIPESTATUS[0]}
          cd ..
          echo "$RC" > base-dex-fork-exit.txt
          echo "FORK_TEST_EXIT=$RC"
          exit 0

      - name: Summarize executable signal
        shell: bash
        run: |
          echo '=== EXECUTION SIGNAL ==='
          RC=$(cat base-dex-fork-exit.txt 2>/dev/null || echo 99)
          grep -E 'EDGE_COUNT|SIZE_COUNT|FORK_PROFITABLE_COUNT|POSITIVE_ROUTE|ROUTE_INDEX|ASSET|AMOUNT_IN_USDC_RAW|BUY_IS_UNI|BUY_TIER|SELL_IS_UNI|SELL_TIER|FORK_GROSS_PNL_USDC_RAW|SPOT_EDGE_BPS_E6' base-dex-fork-validation.log || true
          if [ "$RC" = '0' ] && grep -Eq 'FORK_PROFITABLE_COUNT: [1-9][0-9]*' base-dex-fork-validation.log; then
            echo 'DEX_FORK_SURVIVED=true'
          else
            echo 'DEX_FORK_SURVIVED=false'
          fi

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: base-dex-live-watch-evidence
          path: |
            base-dex-live-scan.jsonl
            dex-generator.log
            dex-candidate.json
            base-dex-fork-validation.log
            base-dex-fork-exit.txt
            dexwatch/test/GeneratedBaseDexArb.t.sol
          retention-days: 7

