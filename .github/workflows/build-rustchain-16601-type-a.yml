name: Build RustChain Type A Production Kit
on:
  push:
    branches: [earn/rustchain-16601-type-a-payout-pipeline]
    paths:
      - 'earn/rustchain-16601-type-a-payout-pipeline/GENERATE_ASSETS.trigger'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: earn/rustchain-16601-type-a-payout-pipeline
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install generation dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq espeak-ng
          python -m pip install --quiet pillow
      - name: Generate and validate package
        working-directory: earn/rustchain-16601-type-a-payout-pipeline
        run: |
          espeak-ng --version
          python generate_assets.py | tee /tmp/type-a-validation.txt
      - name: Commit generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add earn/rustchain-16601-type-a-payout-pipeline
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "build: generate Type A production assets [skip ci]"
          git push origin HEAD:earn/rustchain-16601-type-a-payout-pipeline
