name: Base Morpho Self-Funded E2E

on:
  workflow_dispatch:
  push:
    branches: [profit-engine-v07]
    paths:
      - 'contracts/MorphoSelfFundedLiquidator.sol'
      - '.github/workflows/base-morpho-self-funded-e2e.yml'

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: profit-engine-v07
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Prove zero-prefund liquidation callback path on a Base fork
        shell: bash
        run: |
          set -euo pipefail
          forge build

          REMOTE='https://base-mainnet.g.alchemy.com/public'
          LOCAL='http://127.0.0.1:8545'
          MORPHO='0xBBBBBbbBBb9cC5e90e3b3Af64bdAF62C37EEFFCb'
          ROUTER='0x2626664c2603336E57B271c5C0b26F421741e481'
          QUOTER='0x3d4e44Eb1374240CE5F1B871ab261CD16335B76a'
          FACTORY='0x33128a8fC17869897dcE68Ed026d694621f6FDfD'
          WETH='0x4200000000000000000000000000000000000006'
          WSTETH='0xc1CBa3fCea344f92D9239c08C0568f6F2F0ee452'
          ORACLE='0xaE10cbdAa587646246c8253E4532A002EE4fa7A4'
          IRM='0x46415998764C29aB2a25CbeA6254146D50D22687'
          LLTV='965000000000000000'
          MARKET='0x6aa81f51dfc955df598e18006deae56ce907ac02b0b5358705f1a28fcea23cc0'
          BORROWER='0x10c53e75fE7A7E6bF58a9e68B6a30Fcc7D4e6e2c'
          EOA='0xf39Fd6e51aad88F6F4ce6aB8827279cffFb92266'
          MAX='0xffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffff'

          anvil --fork-url "$REMOTE" --chain-id 8453 --port 8545 --silent >/tmp/anvil-e2e.log 2>&1 &
          ANVIL_PID=$!
          trap 'kill $ANVIL_PID 2>/dev/null || true' EXIT
          for i in {1..30}; do cast block-number --rpc-url "$LOCAL" >/dev/null 2>&1 && break; sleep 1; done
          echo "FORK_BLOCK=$(cast block-number --rpc-url "$LOCAL")"

          DEPLOY=$(forge create contracts/MorphoSelfFundedLiquidator.sol:MorphoSelfFundedLiquidator \
            --constructor-args "$MORPHO" "$ROUTER" \
            --rpc-url "$LOCAL" --from "$EOA" --unlocked --broadcast --json)
          echo "$DEPLOY"
          LIQUIDATOR=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["deployedTo"])' <<<"$DEPLOY")
          echo "LIQUIDATOR=$LIQUIDATOR"

          CONTRACT_WETH_0=$(cast call "$WETH" 'balanceOf(address)(uint256)' "$LIQUIDATOR" --rpc-url "$LOCAL" | awk '{print $1}')
          CONTRACT_WSTETH_0=$(cast call "$WSTETH" 'balanceOf(address)(uint256)' "$LIQUIDATOR" --rpc-url "$LOCAL" | awk '{print $1}')
          echo "CONTRACT_WETH_BEFORE=$CONTRACT_WETH_0"
          echo "CONTRACT_WSTETH_BEFORE=$CONTRACT_WSTETH_0"
          if [ "$CONTRACT_WETH_0" != '0' ] || [ "$CONTRACT_WSTETH_0" != '0' ]; then
            echo 'ZERO_PREFUND_PRECONDITION=false'; exit 1
          fi
          echo 'ZERO_PREFUND_PRECONDITION=true'

          # Fund only the disposable test EOA so we can discover when the real Morpho position
          # becomes liquidatable after simulated interest accrual. The liquidator contract stays at zero.
          cast send "$WETH" 'deposit()' --value 100ether --from "$EOA" --unlocked --rpc-url "$LOCAL" >/dev/null
          cast send "$WETH" 'approve(address,uint256)' "$MORPHO" "$MAX" --from "$EOA" --unlocked --rpc-url "$LOCAL" >/dev/null

          ELIGIBLE_DAY=0
          SPENT=0
          SEIZED=0
          SHARES=0
          for DAY in $(seq 0 45); do
            if [ "$DAY" -gt 0 ]; then
              cast rpc evm_increaseTime 86400 --rpc-url "$LOCAL" >/dev/null
              cast rpc evm_mine --rpc-url "$LOCAL" >/dev/null
            fi
            POS=$(cast call "$MORPHO" 'position(bytes32,address)(uint256,uint128,uint128)' "$MARKET" "$BORROWER" --rpc-url "$LOCAL")
            SHARES=$(printf '%s\n' "$POS" | sed -n '2p' | awk '{print $1}')
            [ "$SHARES" = '0' ] && break
            SNAP=$(cast rpc evm_snapshot --rpc-url "$LOCAL" | tr -d '"')
            WB=$(cast call "$WETH" 'balanceOf(address)(uint256)' "$EOA" --rpc-url "$LOCAL" | awk '{print $1}')
            CB=$(cast call "$WSTETH" 'balanceOf(address)(uint256)' "$EOA" --rpc-url "$LOCAL" | awk '{print $1}')
            set +e
            RAW=$(cast send "$MORPHO" 'liquidate((address,address,address,address,uint256),address,uint256,uint256,bytes)' \
              "($WETH,$WSTETH,$ORACLE,$IRM,$LLTV)" "$BORROWER" 0 "$SHARES" 0x \
              --from "$EOA" --unlocked --rpc-url "$LOCAL" --json 2>&1)
            RC=$?
            set -e
            if [ "$RC" -eq 0 ]; then
              WA=$(cast call "$WETH" 'balanceOf(address)(uint256)' "$EOA" --rpc-url "$LOCAL" | awk '{print $1}')
              CA=$(cast call "$WSTETH" 'balanceOf(address)(uint256)' "$EOA" --rpc-url "$LOCAL" | awk '{print $1}')
              SPENT=$((WB-WA)); SEIZED=$((CA-CB)); ELIGIBLE_DAY=$DAY
              echo "POSITION_BECOMES_LIQUIDATABLE_AFTER_SIMULATED_DAYS=$DAY"
              echo "DISCOVERY_REPAID_WETH_WEI=$SPENT"
              echo "DISCOVERY_SEIZED_WSTETH_WEI=$SEIZED"
              cast rpc evm_revert "$SNAP" --rpc-url "$LOCAL" >/dev/null
              break
            fi
            cast rpc evm_revert "$SNAP" --rpc-url "$LOCAL" >/dev/null
          done

          if [ "$SPENT" = '0' ] || [ "$SEIZED" = '0' ]; then
            echo 'FUTURE_FORK_LIQUIDATION_FOUND=false'
            exit 0
          fi
          echo 'FUTURE_FORK_LIQUIDATION_FOUND=true'

          BEST_OUT=0; BEST_FEE=0
          for FEE in 100 500 3000 10000; do
            POOL=$(cast call "$FACTORY" 'getPool(address,address,uint24)(address)' "$WSTETH" "$WETH" "$FEE" --rpc-url "$LOCAL" 2>/dev/null || true)
            echo "POOL fee=$FEE address=$POOL"
            [ "$POOL" = '0x0000000000000000000000000000000000000000' ] && continue
            set +e
            Q=$(cast call "$QUOTER" 'quoteExactInputSingle((address,address,uint256,uint24,uint160))(uint256,uint160,uint32,uint256)' \
              "($WSTETH,$WETH,$SEIZED,$FEE,0)" --rpc-url "$LOCAL" 2>/dev/null)
            QRC=$?
            set -e
            if [ "$QRC" -eq 0 ]; then
              OUT=$(printf '%s\n' "$Q" | sed -n '1p' | awk '{print $1}')
              echo "QUOTE fee=$FEE amountOutWei=$OUT"
              if [ "$OUT" -gt "$BEST_OUT" ]; then BEST_OUT=$OUT; BEST_FEE=$FEE; fi
            fi
          done
          echo "BEST_FEE=$BEST_FEE BEST_OUT=$BEST_OUT REPAY=$SPENT"
          if [ "$BEST_OUT" -le "$SPENT" ]; then
            echo 'DIRECT_ROUTE_CAN_SELF_FUND=false'
            exit 0
          fi
          echo 'DIRECT_ROUTE_CAN_SELF_FUND=true'

          GROSS=$((BEST_OUT-SPENT))
          # Keep a wide execution cushion. The contract itself still guarantees at least MIN_PROFIT.
          MIN_PROFIT=$((GROSS/4))
          [ "$MIN_PROFIT" -lt 1 ] && MIN_PROFIT=1
          REQUIRED=$((SPENT+MIN_PROFIT))
          OWNER_WETH_BEFORE=$(cast call "$WETH" 'balanceOf(address)(uint256)' "$EOA" --rpc-url "$LOCAL" | awk '{print $1}')

          echo "CALL_MIN_PROFIT_WEI=$MIN_PROFIT CALL_MIN_SWAP_OUT_WEI=$REQUIRED"
          TX=$(cast send "$LIQUIDATOR" 'execute((address,address,address,address,uint256),address,uint256,uint24,uint256,uint256,bytes32)(uint256)' \
            "($WETH,$WSTETH,$ORACLE,$IRM,$LLTV)" "$BORROWER" "$SHARES" "$BEST_FEE" "$REQUIRED" "$MIN_PROFIT" "$MARKET" \
            --from "$EOA" --unlocked --rpc-url "$LOCAL" --json)
          echo "$TX"

          OWNER_WETH_AFTER=$(cast call "$WETH" 'balanceOf(address)(uint256)' "$EOA" --rpc-url "$LOCAL" | awk '{print $1}')
          CONTRACT_WETH_AFTER=$(cast call "$WETH" 'balanceOf(address)(uint256)' "$LIQUIDATOR" --rpc-url "$LOCAL" | awk '{print $1}')
          CONTRACT_WSTETH_AFTER=$(cast call "$WSTETH" 'balanceOf(address)(uint256)' "$LIQUIDATOR" --rpc-url "$LOCAL" | awk '{print $1}')
          OWNER_PROFIT=$((OWNER_WETH_AFTER-OWNER_WETH_BEFORE))

          echo "OWNER_WETH_PROFIT_WEI=$OWNER_PROFIT"
          echo "CONTRACT_WETH_AFTER=$CONTRACT_WETH_AFTER"
          echo "CONTRACT_WSTETH_AFTER=$CONTRACT_WSTETH_AFTER"
          python3 - "$OWNER_PROFIT" "$ELIGIBLE_DAY" "$GROSS" <<'PY'
          import sys
          p,day,g=map(int,sys.argv[1:])
          print(f'OWNER_PROFIT_WETH={p/1e18:.9f}')
          print(f'QUOTED_GROSS_WETH={g/1e18:.9f}')
          print(f'SIMULATED_DAYS_TO_ELIGIBILITY={day}')
          print('END_TO_END_SELF_FUNDED=' + ('true' if p>0 else 'false'))
          PY
