name: Chainlink SVR Readonly Monitor

on:
  workflow_dispatch:
  push:
    branches: [profit-engine-v07]
    paths:
      - 'scripts/svr_monitor.py'
      - '.github/workflows/svr-readonly-monitor.yml'

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install websocket client
        run: python3 -m pip install --user 'websockets>=14,<16'
      - name: Monitor SVR auctions for 3 minutes
        shell: bash
        run: |
          set -o pipefail
          python3 scripts/svr_monitor.py --seconds 180 --out svr-auctions.jsonl 2>&1 | tee svr-monitor.log
      - name: Upload monitor evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: svr-readonly-monitor-evidence
          path: |
            svr-auctions.jsonl
            svr-monitor.log
          retention-days: 30
