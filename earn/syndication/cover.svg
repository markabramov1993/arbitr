<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420" role="img" aria-labelledby="title desc">
  <title id="title">RustChain Miner Dry-Run in GitHub Actions</title>
  <desc id="desc">A terminal-style cover showing five hardware checks passing and anti-emulation failing on a hosted virtual machine.</desc>
  <rect width="1000" height="420" fill="#0d1117"/>
  <rect x="44" y="42" width="912" height="336" rx="18" fill="#161b22" stroke="#30363d" stroke-width="3"/>
  <circle cx="78" cy="72" r="8" fill="#ff7b72"/><circle cx="104" cy="72" r="8" fill="#d29922"/><circle cx="130" cy="72" r="8" fill="#3fb950"/>
  <text x="70" y="132" fill="#f0f6fc" font-family="monospace" font-size="36" font-weight="700">RustChain Miner Dry-Run</text>
  <text x="70" y="174" fill="#8b949e" font-family="monospace" font-size="22">GitHub Actions · Azure VM · reproducible preflight</text>
  <text x="70" y="228" fill="#3fb950" font-family="monospace" font-size="22">PASS  clock drift · cache · SIMD · thermal · jitter</text>
  <text x="70" y="270" fill="#ff7b72" font-family="monospace" font-size="22">FAIL  anti-emulation → Microsoft hypervisor detected</text>
  <text x="70" y="326" fill="#58a6ff" font-family="monospace" font-size="20">python3 rustchain_linux_miner.py --dry-run --show-payload</text>
  <text x="774" y="352" fill="#8b949e" font-family="sans-serif" font-size="16">1000 × 420</text>
</svg>